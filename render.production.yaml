# Render Blueprint (PRODUCTION, from the `main` branch): the API, the worker and Redis, in Frankfurt.
# Separate from render.yaml (staging): create it as its own Blueprint with "Blueprint Path" = render.production.yaml.
# MongoDB on Atlas (cluster `ugbconnect`, database `ugb_connect`), pictures on Cloudflare R2 (bucket `ugb-connect-media`).
# Values marked `sync: false` are asked for when the Blueprint is created, and never stored in this file.
#
# The students' server: real OTP codes by SMS (Twilio), no payment simulator. Until the Wave / Orange Money adapters
# exist, paying answers 503 "Le paiement est momentanément indisponible"; everything else works.

services:
  - type: web
    name: ugb-connect-api
    runtime: docker
    repo: https://github.com/Magueye717/ugb-connect-backend
    branch: main
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/main.js api
    # Collections, validators, indexes and data migrations, before the new version takes traffic.
    preDeployCommand: node dist/main.js migrate
    # Ready = MongoDB and Redis answer.
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - fromGroup: ugb-connect-backend
      - key: PORT
        value: 3000
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ugb-connect-redis
          property: connectionString

  - type: worker
    name: ugb-connect-worker
    runtime: docker
    repo: https://github.com/Magueye717/ugb-connect-backend
    branch: main
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/main.js worker
    autoDeploy: true
    envVars:
      - fromGroup: ugb-connect-backend
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ugb-connect-redis
          property: connectionString

  # Queues (BullMQ) and rate limits. Paid plan: kept on disk across restarts. `noeviction`: a full Redis refuses new
  # jobs instead of silently dropping queued ones.
  - type: keyvalue
    name: ugb-connect-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    # Reachable only from this Render account's services.
    ipAllowList: []

envVarGroups:
  - name: ugb-connect-backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: STAGING
        value: false
      - key: LOG_LEVEL
        value: info
      # Behind Render's proxy: real client IPs for rate limits, https links.
      - key: TRUST_PROXY
        value: true
      # Swagger on /docs: the temporary back office (Q-12).
      - key: DOCS_ENABLED
        value: true

      # Atlas cluster `ugbconnect`: mongodb+srv://USER:PASSWORD@ugbconnect.xxxxx.mongodb.net/?retryWrites=true&w=majority
      # (no database in the path: MONGODB_DB names it; a password with @ : / ? # % must be URL-encoded).
      - key: MONGODB_URI
        sync: false
      # The first administrator: created by the pre-deploy step if no account uses this phone, never changed after.
      - key: BOOTSTRAP_ADMIN_PHONE
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Must match the Atlas database name exactly.
      - key: MONGODB_DB
        value: ugb_connect
      - key: REDIS_PREFIX
        value: ugb

      # `npm run keys` prints a pair: paste both.
      - key: JWT_KID
        value: prod-1
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false
      - key: OTP_PEPPER
        generateValue: true

      # Real codes, sent by SMS. Twilio: the account (AC…), then an API key (SK… + secret) or the auth token,
      # and a sender (TWILIO_FROM, or TWILIO_MESSAGING_SERVICE_SID).
      - key: OTP_DEV_MODE
        value: false
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: PAYMENTS_SIMULATOR
        value: false
      # Checkout links, once real payments exist.
      - key: PUBLIC_API_URL
        value: https://ugb-connect-api.onrender.com

      - key: PUSH_PROVIDER
        value: expo

      # Cloudflare R2: a token and bucket for this server, not the development ones.
      - key: MEDIA_STORAGE
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        value: ugb-connect-media
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_PUBLIC_URL
        sync: false
